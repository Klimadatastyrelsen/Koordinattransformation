# local login and webproj for dev and e2e; bifrost stays remote
services:
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG: '{"interactiveLogin": true, "loginPagePath": "/login.html"}'
    volumes:
      - ./dev/login.html:/login.html:ro
    ports:
      - "8080:8080"
  webproj:
    image: ghcr.io/klimadatastyrelsen/webproj:1.2.7
    ports:
      - "8000:8080"
